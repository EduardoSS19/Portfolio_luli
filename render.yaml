databases:
  - name: portfolio-db
    databaseName: portfolio
    plan: free

services:
  - type: web
    name: portfolio-site
    runtime: docker
    plan: free
    preDeployCommand: python manage.py migrate --noinput
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString