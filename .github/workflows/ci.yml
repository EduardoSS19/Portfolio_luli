name: CI

on:
  push:
    branches:
      - master
      - "hardening/**"
  pull_request:
    branches:
      - master
      - "hardening/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      cms: ${{ steps.filter.outputs.cms }}
      navigation: ${{ steps.filter.outputs.navigation }}
      gallery: ${{ steps.filter.outputs.gallery }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'portfolio/**/*.py'
              - 'config/**/*.py'
              - 'manage.py'
              - 'requirements*.txt'
              - 'pyproject.toml'
              - 'pytest.ini'
              - 'Procfile'
              - 'runtime.txt'
            frontend:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.*'
            cms:
              - 'src/cms/CmsContentManager.jsx'
              - 'src/cms/CmsWorkEditor.jsx'
              - 'src/cms/CmsCategoryManager.jsx'
              - 'src/cms/CmsPage.css'
              - 'tests/e2e/cms-content.spec.js'
              - 'tests/e2e/cms-save-state.spec.js'
              - 'portfolio/cms_content_api.py'
              - 'portfolio/test_cms_content*.py'
            navigation:
              - 'src/components/Nav.jsx'
              - 'src/App.jsx'
              - 'tests/e2e/editorial-navigation.spec.js'
            gallery:
              - 'src/components/GaleriaGrade.jsx'
              - 'src/components/GaleriaGradeDiagnostico.jsx'
              - 'src/components/ObraCard.jsx'
              - 'src/components/SecaoCategoria.jsx'
              - 'src/styles/**'
              - 'tests/e2e/gallery-*.spec.js'
            workflow:
              - '.github/workflows/**'

  workflow-validation:
    name: Validate GitHub Actions workflows
    needs: changes
    if: needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint workflows
        uses: rhysd/actionlint@v1.7.7

  backend:
    name: Django checks and tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check Django configuration
        env:
          DEBUG: "true"
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret
        run: python manage.py check

      - name: Run Django tests
        env:
          DEBUG: "true"
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret
        run: python manage.py test --verbosity 2

      - name: Check production security settings
        env:
          DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret-with-more-than-fifty-characters
          CLOUDINARY_CLOUD_NAME: ci-placeholder
          CLOUDINARY_API_KEY: "0"
          CLOUDINARY_API_SECRET: ci-placeholder
        run: python manage.py check --deploy --fail-level ERROR

  frontend:
    name: React build and targeted browser tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.cms == 'true' || needs.changes.outputs.navigation == 'true' || needs.changes.outputs.gallery == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build

      - name: Install Playwright test runner
        if: needs.changes.outputs.cms == 'true' || needs.changes.outputs.navigation == 'true' || needs.changes.outputs.gallery == 'true' || github.event_name == 'workflow_dispatch'
        run: npx --yes --package=@playwright/test@1.56.1 playwright --version

      - name: Install browser engines for public regression
        if: needs.changes.outputs.gallery == 'true' || github.event_name == 'workflow_dispatch'
        run: npx --yes --package=@playwright/test@1.56.1 playwright install --with-deps chromium webkit

      - name: Install browser engines for navigation validation
        if: needs.changes.outputs.navigation == 'true' && needs.changes.outputs.gallery != 'true' && github.event_name != 'workflow_dispatch'
        run: npx --yes --package=@playwright/test@1.56.1 playwright install --with-deps chromium webkit

      - name: Install Chromium for CMS-only validation
        if: needs.changes.outputs.cms == 'true' && needs.changes.outputs.navigation != 'true' && needs.changes.outputs.gallery != 'true' && github.event_name != 'workflow_dispatch'
        run: npx --yes --package=@playwright/test@1.56.1 playwright install --with-deps chromium

      - name: Link isolated Playwright package for config resolution
        if: needs.changes.outputs.cms == 'true' || needs.changes.outputs.navigation == 'true' || needs.changes.outputs.gallery == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          PLAYWRIGHT_TEST_PACKAGE="$(find "$HOME/.npm/_npx" -path '*/node_modules/@playwright/test/package.json' -print -quit)"
          test -n "$PLAYWRIGHT_TEST_PACKAGE"
          mkdir -p node_modules/@playwright
          ln -s "$(dirname "$PLAYWRIGHT_TEST_PACKAGE")" node_modules/@playwright/test

      - name: Run CMS browser tests
        if: needs.changes.outputs.cms == 'true' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 8
        shell: bash
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/cms-junit.xml
        run: |
          mkdir -p test-results
          PLAYWRIGHT_CLI="$(find "$HOME/.npm/_npx" -path '*/node_modules/playwright/cli.js' -print -quit)"
          test -n "$PLAYWRIGHT_CLI"
          node "$PLAYWRIGHT_CLI" test tests/e2e/cms-content.spec.js tests/e2e/cms-save-state.spec.js --project=chromium-desktop --workers=1 --retries=0 --reporter=list,junit

      - name: Run navigation desktop and mobile tests
        if: needs.changes.outputs.navigation == 'true' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 15
        shell: bash
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/public-junit.xml
        run: |
          mkdir -p test-results
          PLAYWRIGHT_CLI="$(find "$HOME/.npm/_npx" -path '*/node_modules/playwright/cli.js' -print -quit)"
          test -n "$PLAYWRIGHT_CLI"
          node "$PLAYWRIGHT_CLI" test tests/e2e/editorial-navigation.spec.js --project=chromium-desktop --project=webkit-iphone --workers=1 --retries=0 --reporter=list,junit

      - name: Run gallery desktop and mobile regression tests
        if: needs.changes.outputs.gallery == 'true' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 15
        shell: bash
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/gallery-junit.xml
        run: |
          mkdir -p test-results
          PLAYWRIGHT_CLI="$(find "$HOME/.npm/_npx" -path '*/node_modules/playwright/cli.js' -print -quit)"
          test -n "$PLAYWRIGHT_CLI"
          node "$PLAYWRIGHT_CLI" test tests/e2e/gallery-focus-desktop.spec.js tests/e2e/gallery-responsive.spec.js --project=chromium-desktop --project=webkit-iphone --workers=1 --retries=0 --reporter=list,junit

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
