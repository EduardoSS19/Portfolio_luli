name: CI

on:
  push:
    branches:
      - master
      - "hardening/**"
  pull_request:
    branches:
      - master
      - "hardening/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check Django configuration
        env:
          DEBUG: "true"
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret
        run: python manage.py check

      - name: Run Django tests
        env:
          DEBUG: "true"
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret
        run: python manage.py test --verbosity 2

  frontend:
    name: Build React frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install cross-browser test runner
        run: npx --yes --package=@playwright/test@1.56.1 playwright --version

      - name: Install browser engines
        run: npx --yes --package=@playwright/test@1.56.1 playwright install --with-deps chromium

      - name: Link isolated Playwright package for config resolution
        shell: bash
        run: |
          PLAYWRIGHT_TEST_PACKAGE="$(find "$HOME/.npm/_npx" -path '*/node_modules/@playwright/test/package.json' -print -quit)"
          test -n "$PLAYWRIGHT_TEST_PACKAGE"
          mkdir -p node_modules/@playwright
          ln -s "$(dirname "$PLAYWRIGHT_TEST_PACKAGE")" node_modules/@playwright/test

      - name: Diagnose first responsive gallery failure
        timeout-minutes: 4
        run: npx --yes --package=@playwright/test@1.56.1 playwright test --project=chromium-desktop --workers=1 --retries=0 --max-failures=1 --reporter=list
