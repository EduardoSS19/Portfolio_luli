name: CI

on:
  push:
    branches:
      - master
      - "hardening/**"
  pull_request:
    branches:
      - master
      - "hardening/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter frontend changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'tests/e2e/**'
              - 'playwright.config.js'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.*'
              - 'index.html'

  backend:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check Django configuration
        env:
          DEBUG: "true"
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret
        run: python manage.py check

      - name: Run Django tests
        env:
          DEBUG: "true"
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret
        run: python manage.py test --verbosity 2

      - name: Check production security settings
        env:
          DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret-with-more-than-fifty-characters
          CLOUDINARY_CLOUD_NAME: ci-placeholder
          CLOUDINARY_API_KEY: "0"
          CLOUDINARY_API_SECRET: ci-placeholder
        run: python manage.py check --deploy --fail-level ERROR

  frontend:
    name: Build React frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install cross-browser test runner
        run: npx --yes --package=@playwright/test@1.56.1 playwright --version

      - name: Install browser engines
        run: npx --yes --package=@playwright/test@1.56.1 playwright install --with-deps chromium firefox webkit

      - name: Link isolated Playwright package for config resolution
        shell: bash
        run: |
          PLAYWRIGHT_TEST_PACKAGE="$(find "$HOME/.npm/_npx" -path '*/node_modules/@playwright/test/package.json' -print -quit)"
          test -n "$PLAYWRIGHT_TEST_PACKAGE"
          mkdir -p node_modules/@playwright
          ln -s "$(dirname "$PLAYWRIGHT_TEST_PACKAGE")" node_modules/@playwright/test

      - name: Run desktop, mobile and CMS browser tests
        timeout-minutes: 12
        shell: bash
        run: |
          PLAYWRIGHT_CLI="$(find "$HOME/.npm/_npx" -path '*/node_modules/playwright/cli.js' -print -quit)"
          test -n "$PLAYWRIGHT_CLI"
          node "$PLAYWRIGHT_CLI" test --workers=1 --retries=0 --max-failures=1 --reporter=list
