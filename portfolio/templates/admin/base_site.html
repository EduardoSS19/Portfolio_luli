{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | Painel do portfólio{% endblock %}

{% block branding %}
<div id="site-name"><a href="{% url 'admin:index' %}">Portfólio <span class="portfolio-brand-muted">/ painel de gerenciamento</span></a></div>
{% endblock %}

{% block extrahead %}
{{ block.super }}
<style>
:root {
  --site-accent: {{ site_appearance.accent }};
  --site-background: {{ site_appearance.background }};
  --site-background-alt: {{ site_appearance.background_alt }};
  --site-surface: {{ site_appearance.surface }};
  --site-text: {{ site_appearance.text }};
  --site-border: {{ site_appearance.border }};
}
</style>
<link rel="stylesheet" href="{% static 'admin/css/portfolio_admin.css' %}">
<script src="{% static 'admin/js/portfolio_admin.js' %}" defer></script>
{% endblock %}
